syntax = "proto3";

option csharp_namespace = "CodeMigrationTool.Shared.Protos";

package instrumentation;

service InstrumentationAgent {
  rpc LoadApplication(LoadRequest) returns (LoadResponse);
  rpc ExecuteMethod(ExecuteRequest) returns (ExecuteResponse);
  rpc GetCallStack(CallStackRequest) returns (CallStackResponse);
  rpc InspectObject(InspectRequest) returns (InspectResponse);
  rpc ListMethods(ListMethodsRequest) returns (ListMethodsResponse);
  rpc HealthCheck(Empty) returns (HealthResponse);
}

message LoadRequest {
  string app_path = 1;
  map<string, string> env_vars = 2;
}

message LoadResponse {
  bool success = 1;
  string error_message = 2;
  repeated MethodSignature methods = 3;
}

message ExecuteRequest {
  string method_name = 1;
  string args_json = 2;
  bool capture_trace = 3;
}

message ExecuteResponse {
  string trace_id = 1;
  string return_value_json = 2;
  int64 execution_time_ms = 3;
  repeated string side_effects = 4;
  string exception_info = 5;
}

message CallStackRequest {
  string trace_id = 1;
}

message CallStackResponse {
  repeated CallFrame frames = 1;
}

message CallFrame {
  string method_signature = 1;
  string declaring_type = 2;
  string file_path = 3;
  int32 line_number = 4;
  string locals_json = 5;
}

message InspectRequest {
  string expression = 1;
  int32 max_depth = 2;
}

message InspectResponse {
  string type_name = 1;
  string value_json = 2;
}

message ListMethodsRequest {
  string namespace_filter = 1;
}

message ListMethodsResponse {
  repeated MethodSignature methods = 1;
}

message MethodSignature {
  string full_name = 1;
  string declaring_type = 2;
  string return_type = 3;
  repeated string parameter_types = 4;
  repeated string attributes = 5;
}

message Empty {}

message HealthResponse {
  bool healthy = 1;
}
